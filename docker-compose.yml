# Postgres target for the benchmark. No credentials leave your machine.
# Port 55432 avoids clashing with a Postgres you may already run on 5432.
services:
  postgres:
    image: postgres:18
    container_name: dbt-adbc-bench-pg
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: bench
    ports:
      - "${PG_PORT:-55432}:5432"
    # Benchmark-friendly but still durable settings; see README "Fairness".
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_timeout=15min
    shm_size: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench -d bench"]
      interval: 2s
      timeout: 3s
      retries: 30

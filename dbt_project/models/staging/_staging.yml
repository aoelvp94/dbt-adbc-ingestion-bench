version: 2

models:
  - name: stg_customers
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: country_code
        data_tests:
          - accepted_values:
              arguments:
                values: ["AR", "BR", "CL", "CO", "MX", "PE", "UY", "ES", "PT", "FR", "DE", "US"]
  - name: stg_orders
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ["placed", "shipped", "delivered", "returned", "cancelled"]
      - name: coupon_code
        data_tests:
          - accepted_values:
              arguments:
                values: ["WELCOME10", "SPRING5", "VIP20"]
